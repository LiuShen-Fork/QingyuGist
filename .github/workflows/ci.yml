name: CI

on:
  push:
    branches:
      - master
      - 'dev-*'
  workflow_dispatch:

  pull_request:
    paths-ignore:
      - '**.md'

# A push to a pull request supersedes the previous run for the same branch;
# pushes to master always run to completion so every commit keeps a record.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  GO_VERSION: "1.27"
  NODE_VERSION: "26"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go ${{ env.GO_VERSION }}
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15
          args: --timeout=20m --disable=errcheck

      - name: Format
        run: make fmt check_changes

  check:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go ${{ env.GO_VERSION }}
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Check Go modules
        run: make go_mod check_changes

      - name: Vet
        run: go vet ./...

      - name: Check translations
        run: make check-tr

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Vite strips types without checking them, so a broken annotation would
      # otherwise only surface at runtime. tsc is the only gate for that.
      - name: Typecheck
        run: npm run typecheck

      - name: Build assets
        run: npm run build

  test-db:
    name: Test
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: ["ubuntu-latest"]
        go: ["1.27"]
        database: [postgres, mysql]
        include:
          - database: postgres
            image: postgres:16
            port: 5432:5432
          - database: mysql
            image: mysql:8
            port: 3306:3306

    runs-on: ${{ matrix.os }}
    services:
      database:
        image: ${{ matrix.image }}
        ports:
          - ${{ matrix.port }}
        env:
          POSTGRES_PASSWORD: "qingyugist"
          POSTGRES_DB: qingyugist_test
          MYSQL_ROOT_PASSWORD: "qingyugist"
          MYSQL_DATABASE: qingyugist_test
        options: >-
          --health-cmd ${{ matrix.database == 'postgres' && 'pg_isready' || '"mysqladmin ping"' }}
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      meilisearch:
        image: getmeili/meilisearch:latest
        ports:
          - 47700:7700
        env:
          MEILI_NO_ANALYTICS: true
          MEILI_ENV: development
        options: >-
          --health-cmd "curl -sf http://localhost:7700/health"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go ${{ matrix.go }}
        uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}

      - name: Run tests
        run: make test TEST_DB_TYPE=${{ matrix.database }}
        env:
          QYG_TEST_MEILI_HOST: http://localhost:47700

  test:
    name: Test
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # macOS arm64 hosted runners are capacity-constrained and jobs queued
        # for them are cancelled after 15 minutes with "The job was not
        # acquired by Runner of type hosted". Pin the Intel image so the macOS
        # leg actually runs; revisit once arm64 capacity is dependable.
        os: ["ubuntu-latest", "macos-26-intel"]
        go: ["1.27"]
        database: ["sqlite"]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go ${{ matrix.go }}
        uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}

      - name: Run tests
        run: make test TEST_DB_TYPE=${{ matrix.database }}

  build:
    name: Build
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # See the note on the test job: Intel avoids the arm64 queue.
        os: ["ubuntu-latest", "macos-26-intel", "windows-latest"]
        go: ["1.27"]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go ${{ matrix.go }}
        uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Build
        shell: bash
        run: make
