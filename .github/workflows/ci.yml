name: CI

on:
  push:
    branches:
      - master
      - 'dev-*'
  workflow_dispatch:

  pull_request:
    paths-ignore:
      - '**.md'

# A push to a pull request supersedes the previous run for the same branch;
# pushes to master always run to completion so every commit keeps a record.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  GO_VERSION: "1.27"
  NODE_VERSION: "26"

jobs:
  # Static analysis and the translation check share one job: they each take
  # under a minute and would otherwise pay for three separate runners.
  static:
    name: Static
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go ${{ env.GO_VERSION }}
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15
          args: --timeout=20m --disable=errcheck

      # Formatting, module tidiness and vet all fail the same way a lint error
      # does, so they run here rather than on runners of their own.
      - name: Format
        run: make fmt check_changes

      - name: Check Go modules
        run: make go_mod check_changes

      - name: Vet
        run: go vet ./...

      - name: Check translations
        run: make check-tr

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Vite strips types without checking them, so a broken annotation would
      # otherwise only surface at runtime. tsc is the only gate for that. The
      # asset build itself is covered by the build job.
      - name: Typecheck
        run: npm run typecheck

  # The fast leg every push and pull request runs. Keeping the full matrix off
  # the pull-request path takes the feedback loop from ~11 minutes (dominated
  # by the macOS test runner) to roughly two.
  test:
    name: Test (sqlite)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go ${{ env.GO_VERSION }}
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Run tests
        run: make test TEST_DB_TYPE=sqlite

  # PostgreSQL and MySQL only guard SQL that is about to be tagged, so they
  # stop running on every pull request.
  test-databases:
    name: Test (${{ matrix.database }})
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/master')
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        database: [postgres, mysql]
        include:
          - database: postgres
            image: postgres:16
            port: 5432:5432
          - database: mysql
            image: mysql:8
            port: 3306:3306

    runs-on: ubuntu-latest
    services:
      database:
        image: ${{ matrix.image }}
        ports:
          - ${{ matrix.port }}
        env:
          POSTGRES_PASSWORD: "qingyugist"
          POSTGRES_DB: qingyugist_test
          MYSQL_ROOT_PASSWORD: "qingyugist"
          MYSQL_DATABASE: qingyugist_test
        options: >-
          --health-cmd ${{ matrix.database == 'postgres' && 'pg_isready' || '"mysqladmin ping"' }}
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      meilisearch:
        image: getmeili/meilisearch:latest
        ports:
          - 47700:7700
        env:
          MEILI_NO_ANALYTICS: true
          MEILI_ENV: development
        options: >-
          --health-cmd "curl -sf http://localhost:7700/health"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go ${{ env.GO_VERSION }}
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Run tests
        run: make test TEST_DB_TYPE=${{ matrix.database }}
        env:
          QYG_TEST_MEILI_HOST: http://localhost:47700

  build:
    name: Build (linux)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go ${{ env.GO_VERSION }}
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Build
        run: make

  # Cross-platform compilation is checked before a release, not on every
  # commit: the release workflow builds all five targets anyway.
  build-platforms:
    name: Build (${{ matrix.os }})
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/master')
    # macOS arm64 hosted runners are capacity-constrained and jobs queued for
    # them are cancelled after 15 minutes with "The job was not acquired by
    # Runner of type hosted". Pin the Intel image so the macOS leg actually
    # runs; revisit once arm64 capacity is dependable.
    strategy:
      fail-fast: false
      matrix:
        os: ["macos-26-intel", "windows-latest"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go ${{ env.GO_VERSION }}
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Build
        shell: bash
        run: make
