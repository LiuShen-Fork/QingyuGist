{{ define "page_header" }}
{{/* Shared page heading: optional eyebrow, 28px title, optional subtitle. */}}
<header class="flex flex-wrap items-end justify-between gap-4">
    <div class="min-w-0">
        {{ if .Eyebrow }}<p class="text-muted-foreground text-[11px] font-medium tracking-[0.14em] uppercase">{{ .Eyebrow }}</p>{{ end }}
        <h1 class="{{ if .Eyebrow }}mt-1.5{{ end }} text-[28px] leading-tight font-semibold tracking-tight break-words">{{ .Title }}</h1>
        {{ if .Subtitle }}<p class="text-muted-foreground mt-1.5 max-w-2xl text-sm">{{ .Subtitle }}</p>{{ end }}
    </div>
</header>
{{ end }}
