{{ define "admin_header" }}
<header class="flex flex-wrap items-end justify-between gap-4">
    <div class="space-y-1">
        <p class="text-muted-foreground text-[11px] font-medium tracking-[0.14em] uppercase">{{ .Locale.Tr "admin.admin_panel" }}</p>
        <h1 class="text-2xl font-semibold tracking-tight">{{ .Title }}</h1>
        {{ if .Subtitle }}<p class="text-muted-foreground text-sm">{{ .Subtitle }}</p>{{ end }}
    </div>
    {{ if .Count }}
    <span class="bg-muted text-muted-foreground inline-flex items-center rounded-full px-3 py-1 text-xs font-medium tabular-nums">{{ .Count }}</span>
    {{ end }}
</header>
{{ end }}
