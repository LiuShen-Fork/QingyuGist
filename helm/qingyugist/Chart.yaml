apiVersion: v2
name: qingyugist
description: QingyuGist Helm chart for Kubernetes
type: application
version: 0.14.0
appVersion: 1.15.3
home: https://qingyugist.io
icon: https://raw.githubusercontent.com/LiuShen-Fork/QingyuGist/master/public/img/qingyugist.svg
sources:
  - https://github.com/LiuShen-Fork/QingyuGist
dependencies:
  - name: postgresql
    repository: oci://registry-1.docker.io/bitnamicharts
    version: 16.7.27
    condition: postgresql.enabled
  - name: meilisearch
    repository: https://meilisearch.github.io/meilisearch-kubernetes
    version: 0.26.0
    condition: meilisearch.enabled
